<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SentinelAI</title>
    <meta name="description" content="Secure login portal for SentinelAI surveillance administration system.">
    <link rel="stylesheet" href="./index.css">
</head>
<body class="page-centered">

    <div class="panel" style="max-width: 440px;">

        <!-- Brand Header -->
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--gradient-brand); border-radius: var(--radius-lg); font-size: 1.6rem; margin-bottom: 16px; box-shadow: var(--shadow-glow-blue);">
                🛡️
            </div>
            <h1 style="font-size: 1.5rem; margin-bottom: 6px;" class="heading-gradient">SentinelAI</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                Sign in to access the surveillance command center.
            </p>
        </div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label" for="login">Employee ID</label>
                <input type="text" id="login" class="form-input" placeholder="e.g. EMP123" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="Password">Password</label>
                <input type="password" id="Password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="checkbox-group" style="margin-bottom: 24px;">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me on this device</label>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary">
                <span>Sign In</span>
            </button>
        </form>

        <p style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--text-muted);">
            Protected by Firebase Authentication
        </p>
    </div>

    <!-- Particle background -->
    <script src="./particles.js"></script>
    <!-- Load main script as ES6 module -->
    <script type="module" src="./login.js"></script>
</body>
</html>
